name: 插件验收
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          python-version: "3.12"
      - name: 安装 FFmpeg（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 安装 FFmpeg（Windows）
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/build_plugin.py
      - run: uv build
      - run: uv run python scripts/verify_dist.py
      - run: uv pip check
